plugins { id 'com.android.application' }

android {
    namespace 'com.kabro.autoeditor'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kabro.autoeditor'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    packaging {
        resources.excludes += ['/META-INF/{AL2.0,LGPL2.1}', '/META-INF/DEPENDENCIES']
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-full-gpl:8.1.7'
}
